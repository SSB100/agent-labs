name: R12 screenshot diagnostic

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: r12-screenshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r12-zoom-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install exact repository dependencies
        run: npm install --no-audit --no-fund
      - name: Install pinned Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Install isolated SQL fixture and compile source contracts
        run: |
          npm install --prefix "$RUNNER_TEMP/r12-zoom-sql-host" --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.5.8 pg@8.16.3
          npm run pretest
      - name: Capture identical application runtime at real zoom with inert transport
        env:
          R12_SQL_TEST_HOST: ${{ runner.temp }}/r12-zoom-sql-host
        run: node scripts/verify-r03-next.mjs --r12-only
      - name: Preserve bounded screenshot evidence and coordinate metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r12-zoom-diagnostic-${{ github.sha }}
          path: |
            test-results/r03-next/r12-*.png
            test-results/r03-next/r12-*.json
            test-results/r03-next/r12-*.log
            test-results/r03-next/isolation.json
          if-no-files-found: error
          retention-days: 14
