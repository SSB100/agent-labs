name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://tfdareuwrshjuevuiwvn.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      GUIDED_UI_BROWSER: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install pinned Chromium for owner UI verification
        run: npx playwright-core install --with-deps chromium

      - name: Capture dense console preview
        continue-on-error: true
        run: node --test tests/console-visual.test.mjs

      - name: Upload early console preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-preview-${{ github.sha }}
          path: test-results/guided-ui/console-overview-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Run complete gate
        run: npm run check

      - name: Upload synthetic owner UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guided-owner-ui-${{ github.sha }}
          path: test-results/guided-ui/*.png
          if-no-files-found: warn
          retention-days: 14
