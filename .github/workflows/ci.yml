      - name: Verify reviewed knowledge lifecycle, privacy, immutable usage and actual PostgreSQL races
        env:
          R09_SQL_TEST_HOST: ${{ runner.temp }}/r09-sql-host
          R09_REQUIRE_POSTGRES: "1"
          R09_POSTGRES_URL: postgresql://r09_test:r09-isolated-fixture@127.0.0.1:5432/r09_test
        run: node --test tests/r09-knowledge-sql.test.mjs

  r10-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: r10_test
          POSTGRES_DB: r10_test
          POSTGRES_PASSWORD: r10-isolated-fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U r10_test -d r10_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install pinned isolated SQL runtimes
        run: npm install --prefix "$RUNNER_TEMP/r10-sql-host" --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.5.8 pg@8.16.3
      - name: Verify viewer ACLs, one-shot epochs, revocation and actual PostgreSQL races
        env:
          R10_SQL_TEST_HOST: ${{ runner.temp }}/r10-sql-host
          R10_REQUIRE_POSTGRES: "1"
          R10_POSTGRES_URL: postgresql://r10_test:r10-isolated-fixture@127.0.0.1:5432/r10_test
        run: node --test tests/r10-viewer-sql.test.mjs

  r11-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: r11_test
          POSTGRES_DB: r11_test
          POSTGRES_PASSWORD: r11-isolated-fixture
        ports:
