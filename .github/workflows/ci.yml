      - name: Install repository-pinned dependencies and isolated SQL runtimes
        run: |
          npm install --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/r11-sql-host" --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.5.8 pg@8.16.3
          npm run pretest
      - name: Verify source marker ACLs, runtime integration and observed PostgreSQL races
        env:
          R11_SQL_TEST_HOST: ${{ runner.temp }}/r11-sql-host
          R11_PUBLIC_RESEARCH_POSTGRES_URL: postgresql://r11_test:r11-research-isolated-fixture@127.0.0.1:5432/r11_research_test
          R11_RESEARCH_EXPIRY_POSTGRES_URL: postgresql://r11_test:r11-research-isolated-fixture@127.0.0.1:5433/r11_research_test
        run: |
          node --test tests/r11-public-research-sql.test.mjs tests/r11-public-research-runtime-sql.test.mjs tests/r11-public-research-owner-sql.test.mjs tests/r11-public-research-repair-sql.test.mjs tests/r11-public-research-window-sql.test.mjs
          node --test tests/r11-pending-receipt-sql.test.mjs

  r12-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: r12_test
          POSTGRES_DB: r12_test
          POSTGRES_PASSWORD: r12-isolated-fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U r12_test -d r12_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install pinned isolated SQL runtime and source compiler
        run: |
          npm install --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/r12-sql-host" --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.5.8 pg@8.16.3
          npm run pretest
      - name: Verify R12 discovery and one-review continuation on PostgreSQL
        env:
          R12_SQL_TEST_HOST: ${{ runner.temp }}/r12-sql-host
          R12_REQUIRE_POSTGRES: "1"
          R12_POSTGRES_URL: postgresql://r12_test:r12-isolated-fixture@127.0.0.1:5432/r12_test
        run: node --test tests/r12-discovery-scope-sql.test.mjs tests/r12-owner-preparation-route.test.mjs tests/r12-bootstrap-rehearsal.test.mjs

      - name: Verify full-shape R12 dispatch within the unchanged three-second SQL budget
        env:
          R12_SQL_TEST_HOST: ${{ runner.temp }}/r12-sql-host
          R12_REQUIRE_POSTGRES: "1"
          R12_POSTGRES_URL: postgresql://r12_test:r12-isolated-fixture@127.0.0.1:5432/r12_test
          R12_SQL_SUCCESSOR_ONLY: "1"
          R12_SQL_FULL_SHAPE: "1"
        run: |
          export R12_CI_POSTGRES_ADDRESS="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' '${{ job.services.postgres.id }}')"
          node scripts/reset-r12-ci-database.mjs
          node --test tests/r12-discovery-scope-sql.test.mjs

      - name: Install pinned official PostgREST for real HTTP deadline qualification
        run: |
          mkdir -p "$RUNNER_TEMP/r12-postgrest"
          curl --fail --location --output "$RUNNER_TEMP/r12-postgrest/postgrest.tar.xz" https://github.com/PostgREST/postgrest/releases/download/v13.0.7/postgrest-v13.0.7-linux-static-x86-64.tar.xz
          printf '%s  %s\n' '4153f81ccc40e7b735edc89cd84b49da25ba27eb37d57c7f6a82c9005a0b762b' "$RUNNER_TEMP/r12-postgrest/postgrest.tar.xz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/r12-postgrest/postgrest.tar.xz" -C "$RUNNER_TEMP/r12-postgrest"

      - name: Verify recovery dispatch and send through real PostgREST HTTP
        env:
          R12_SQL_TEST_HOST: ${{ runner.temp }}/r12-sql-host
          R12_REQUIRE_POSTGRES: "1"
          R12_POSTGRES_URL: postgresql://r12_test:r12-isolated-fixture@127.0.0.1:5432/r12_test
          R12_REQUIRE_POSTGREST: "1"
          R12_POSTGREST_BINARY: ${{ runner.temp }}/r12-postgrest/postgrest
          R12_HTTP_REPORT: /tmp/r12-http-ci-report.json
        run: |
          export R12_CI_POSTGRES_ADDRESS="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' '${{ job.services.postgres.id }}')"
          node scripts/reset-r12-ci-database.mjs
          node --test tests/r12-recovery-postgrest-http.test.mjs

      - name: Verify cold-backend terminal sequence and bounded response artifacts
        env:
          R12_SQL_TEST_HOST: ${{ runner.temp }}/r12-sql-host
          R12_REQUIRE_POSTGRES: "1"
          R12_POSTGRES_URL: postgresql://r12_test:r12-isolated-fixture@127.0.0.1:5432/r12_test
          R12_REQUIRE_POSTGREST: "1"
          R12_POSTGREST_BINARY: ${{ runner.temp }}/r12-postgrest/postgrest
          R12_HTTP_SEQUENCE_ONLY: "1"
          R12_HTTP_REPORT: /tmp/r12-http-ci-terminal-cold.json
        run: |
          export R12_CI_POSTGRES_ADDRESS="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' '${{ job.services.postgres.id }}')"
          node scripts/reset-r12-ci-database.mjs
          node --test tests/r12-recovery-postgrest-http.test.mjs

      - name: Verify committed send and reconciliation lock races
        env:
          R12_SQL_TEST_HOST: ${{ runner.temp }}/r12-sql-host
          R12_REQUIRE_POSTGRES: "1"
          R12_POSTGRES_URL: postgresql://r12_test:r12-isolated-fixture@127.0.0.1:5432/r12_test
          R12_RPC_HTTP_ONLY: "1"
          R12_SQL_FULL_SHAPE: "1"
          R12_RECONCILIATION_RACES: "1"
          R12_RECONCILIATION_REPORT: /tmp/r12-races-ci-report.json
        run: |
          export R12_CI_POSTGRES_ADDRESS="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' '${{ job.services.postgres.id }}')"
          node scripts/reset-r12-ci-database.mjs
          node --test tests/r12-recovery-reconciliation-races.test.mjs

      - name: Preserve recovery HTTP deadline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r12-recovery-http-${{ github.sha }}
          path: |
            /tmp/r12-http-ci-report.json
            /tmp/r12-http-ci-terminal-cold.json
            /tmp/r12-races-ci-report.json
          if-no-files-found: warn
          retention-days: 14

  r03-next:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install repository-pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Install pinned inert browser
        run: npx playwright-core install --with-deps chromium
      - name: Install isolated R12 Next SQL fixture host
        run: |
          npm install --prefix "$RUNNER_TEMP/r12-next-sql-host" --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.5.8 pg@8.16.3
          npm run pretest
      - name: Verify real production Next navigation and actions
        env:
          R12_SQL_TEST_HOST: ${{ runner.temp }}/r12-next-sql-host
        run: |
          node tests/next-fixture/knowledge-contracts.mjs
          node scripts/verify-r03-next.mjs
      - name: Preserve all screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r03-next-${{ github.sha }}
          path: test-results/r03-next/
          if-no-files-found: error
          retention-days: 14

      - name: Preserve scoped R11 connection screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r11-connections-ui-${{ github.sha }}
          path: |
            test-results/r03-next/*connection-qualification*.png
            test-results/r03-next/r11-*.png
          if-no-files-found: error
          retention-days: 14

      - name: Preserve small Next diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r03-diagnostics-${{ github.sha }}
          path: |
            test-results/r03-next/*.json
            test-results/r03-next/*.jsonl
            test-results/r03-next/*.log
          if-no-files-found: error
          retention-days: 14
      - name: Preserve actual Next desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r03-desktop-${{ github.sha }}
          path: |
            test-results/r03-next/*-1280x720.png
            test-results/r03-next/*-1440x900.png
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve actual Next mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r03-mobile-${{ github.sha }}
          path: |
            test-results/r03-next/*-390x844.png
            test-results/r03-next/*-320x800.png
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve actual Next zoom reflow screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r03-reflow-${{ github.sha }}
          path: |
            test-results/r03-next/*-640x360.png
            test-results/r03-next/*-zoom200.png
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve bounded R10 viewer screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r10-viewer-ui-${{ github.sha }}
          path: test-results/r03-next/r10-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve scoped R12 research screenshots and action evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r12-research-ui-${{ github.sha }}
          path: |
            test-results/r03-next/r12-*.png
            test-results/r03-next/r12-*.json
            test-results/r03-next/r12-*.log
          if-no-files-found: error
          retention-days: 14
