        run: node --test tests/r07-quest-controller-sql.test.mjs tests/r07-quest-process.test.mjs
      - name: Verify actual PostgreSQL controller races
        env:
          R07_SQL_TEST_HOST: ${{ runner.temp }}/r07-sql-host
