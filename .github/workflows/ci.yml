name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: inert-ci-placeholder
      GUIDED_UI_BROWSER: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install pinned Chromium for owner UI verification
        run: npx playwright-core install --with-deps chromium

      # Fail before browser startup when a strict hydration fixture cannot bundle.
      # Compile core fixtures once; the complete gate below reuses that output.
      - name: Preflight isolated browser fixture bundles
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/tests/next-fixture/block-network.mjs
          GUIDED_UI_BROWSER: "0"
        run: |
          npm run pretest
          node --test --test-name-pattern='bundles.*production|browser document bundles' tests/console-collection-browser.test.mjs tests/console-library-browser.test.mjs tests/console-research-browser.test.mjs tests/console-decisions-browser.test.mjs

      # Same complete check components, without recompiling the core fixtures.
      # Full browser suites execute once and produce their acceptance artifacts.
      - name: Run complete gate
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/tests/next-fixture/block-network.mjs
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run lint && npm run typecheck && node --test tests/*.test.mjs && npx next build

      - name: Upload synthetic owner UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guided-owner-ui-${{ github.sha }}
          path: test-results/guided-ui/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve bounded actual R10 producer screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r10-producer-ui-${{ github.sha }}
          path: test-results/guided-ui/r10-confined-producer.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload final Decisions screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decisions-owner-ui-${{ github.sha }}
          path: test-results/guided-ui/console-decisions-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload final bounded Work and Activity screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collections-owner-ui-${{ github.sha }}
          path: |
            test-results/guided-ui/console-r02-*.png
            !test-results/guided-ui/console-r02-library-*.png
            !test-results/guided-ui/console-r02-research-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload final Library viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-owner-ui-${{ github.sha }}
          path: test-results/guided-ui/console-r02-library-*-viewport.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload final Library full-page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-fullpage-ui-${{ github.sha }}
          path: |
            test-results/guided-ui/console-r02-library-*.png
            !test-results/guided-ui/console-r02-library-*-viewport.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload final Business continuity screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-continuity-owner-ui-${{ github.sha }}
          path: test-results/guided-ui/business-B-research-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload final research sheet screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-sheet-owner-ui-${{ github.sha }}
          path: test-results/guided-ui/console-sheet-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload final Research viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-owner-ui-${{ github.sha }}
          path: test-results/guided-ui/console-r02-research-*-viewport.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload final Research full-page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-fullpage-ui-${{ github.sha }}
          path: |
            test-results/guided-ui/console-r02-research-*.png
            !test-results/guided-ui/console-r02-research-*-viewport.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload final shared navigation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-owner-ui-${{ github.sha }}
          path: test-results/guided-ui/navigation-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve R04 Quest viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r04-quest-ui-${{ github.sha }}
          path: test-results/r04-quest/
          if-no-files-found: warn
          retention-days: 14

  r04-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: r04_test
          POSTGRES_DB: r04_test
          POSTGRES_PASSWORD: r04-isolated-fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U r04_test -d r04_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install pinned isolated PostgreSQL runtime
        run: npm install --prefix "$RUNNER_TEMP/r04-sql-host" --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.5.8 pg@8.16.3
      - name: Replay migrations and exercise owner isolation and revision contracts
        env:
          R04_SQL_TEST_HOST: ${{ runner.temp }}/r04-sql-host
        run: node --test tests/r04-quest-sql.test.mjs
      - name: Verify independent-session PostgreSQL races
        env:
          R04_SQL_TEST_HOST: ${{ runner.temp }}/r04-sql-host
          R04_PG_TEST: "1"
          R04_PG_PORT: "5432"
          R04_PG_PASSWORD: r04-isolated-fixture
        run: node --test tests/r04-quest-concurrency.test.mjs

