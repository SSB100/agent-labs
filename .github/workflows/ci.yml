name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_PUBLIC_SUPABASE_URL: https://tfdareuwrshjuevuiwvn.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      GUIDED_UI_BROWSER: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install pinned Chromium for owner UI verification
        run: npx playwright-core install --with-deps chromium

      - name: Capture the changed Research journeys first
        id: research-previews
        continue-on-error: true
        run: node --test tests/console-research-browser.test.mjs

      - name: Upload early Research viewport previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-preview-${{ github.sha }}
          path: test-results/guided-ui/console-r02-research-*-viewport.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload early Research full-page previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-fullpage-preview-${{ github.sha }}
          path: |
            test-results/guided-ui/console-r02-research-*.png
            !test-results/guided-ui/console-r02-research-*-viewport.png
          if-no-files-found: warn
          retention-days: 14

      - name: Require the changed Research gate and populated captures
        env:
          RESEARCH_OUTCOME: ${{ steps.research-previews.outcome }}
        run: |
          echo "Early Research tests: $RESEARCH_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          test "$RESEARCH_OUTCOME" = "success"
          node -e "const fs=require('node:fs'); for(const viewport of ['1280x720','1440x900']) for(const kind of ['roots','records']) fs.accessSync('test-results/guided-ui/console-r02-research-'+kind+'-selected-'+viewport+'-viewport.png')"

      - name: Capture compact console and bounded collection previews
        id: owner-previews
        continue-on-error: true
        run: node --test tests/console-visual.test.mjs tests/console-connections.test.mjs tests/console-decisions-browser.test.mjs tests/console-collection-browser.test.mjs tests/console-library-browser.test.mjs tests/console-business.test.mjs tests/console-sheet.test.mjs tests/guided-ui.test.mjs

      - name: Report preview test outcome
        if: always()
        env:
          PREVIEW_OUTCOME: ${{ steps.owner-previews.outcome }}
        run: |
          echo "Early owner UI tests: $PREVIEW_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PREVIEW_OUTCOME" != "success" ]; then
            echo "::warning::Early owner UI tests did not pass. Uploaded previews are diagnostic only; the full gate must pass before release."
          fi

      - name: Upload early console preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-preview-${{ github.sha }}
          path: |
            test-results/guided-ui/console-overview-*.png
            test-results/guided-ui/console-connections-*.png
            test-results/guided-ui/console-decisions-*.png
            test-results/guided-ui/console-r02-*.png
            !test-results/guided-ui/console-r02-research-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload early bounded collection preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collections-preview-${{ github.sha }}
          path: |
            test-results/guided-ui/console-r02-*.png
            !test-results/guided-ui/console-r02-library-*.png
            !test-results/guided-ui/console-r02-research-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload early Overview preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overview-preview-${{ github.sha }}
          path: test-results/guided-ui/console-overview-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Require actual Decisions preview screenshots
        run: >-
          node -e "const fs=require('node:fs'); for(const width of [1280,1440]) { const file='test-results/guided-ui/console-decisions-root-populated-'+width+'.png'; fs.accessSync(file); console.log('Verified actual hosted capture:',file); }"

      - name: Upload early Library viewport previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-preview-${{ github.sha }}
          path: test-results/guided-ui/console-r02-library-*-viewport.png
          if-no-files-found: warn
          retention-days: 14

      - name: Require populated Library viewport screenshots
        run: >-
          node -e "const fs=require('node:fs'); for(const width of [1280,1440]) for(const view of ['design-selected','record-selected','paid-no-asset']) { const file='test-results/guided-ui/console-r02-library-'+view+'-'+width+'-viewport.png'; fs.accessSync(file); console.log('Verified actual Library capture:',file); }"

      - name: Upload early Business continuity screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-continuity-preview-${{ github.sha }}
          path: test-results/guided-ui/business-B-research-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload early research sheet screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-sheet-preview-${{ github.sha }}
          path: test-results/guided-ui/console-sheet-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload early shared navigation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-preview-${{ github.sha }}
          path: test-results/guided-ui/navigation-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Require populated Work and Activity viewport screenshots
        run: >-
          node -e "const fs=require('node:fs'); for(const width of [1280,1440]) for(const view of ['work','activity']) { const file='test-results/guided-ui/console-r02-'+view+'-selected-'+width+'.png'; fs.accessSync(file); console.log('Verified actual populated capture:',file); }"

      - name: Require the early owner UI gate
        env:
          PREVIEW_OUTCOME: ${{ steps.owner-previews.outcome }}
        run: test "$PREVIEW_OUTCOME" = "success"

      - name: Run complete gate
        run: npm run check

      - name: Upload synthetic owner UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guided-owner-ui-${{ github.sha }}
          path: test-results/guided-ui/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload final Decisions screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decisions-owner-ui-${{ github.sha }}
          path: test-results/guided-ui/console-decisions-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload final bounded Work and Activity screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collections-owner-ui-${{ github.sha }}
          path: |
            test-results/guided-ui/console-r02-*.png
            !test-results/guided-ui/console-r02-library-*.png
            !test-results/guided-ui/console-r02-research-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload final Library viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-owner-ui-${{ github.sha }}
          path: test-results/guided-ui/console-r02-library-*-viewport.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload final Library full-page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-fullpage-ui-${{ github.sha }}
          path: |
            test-results/guided-ui/console-r02-library-*.png
            !test-results/guided-ui/console-r02-library-*-viewport.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload final Business continuity screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-continuity-owner-ui-${{ github.sha }}
          path: test-results/guided-ui/business-B-research-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload final research sheet screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-sheet-owner-ui-${{ github.sha }}
          path: test-results/guided-ui/console-sheet-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload final Research viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-owner-ui-${{ github.sha }}
          path: test-results/guided-ui/console-r02-research-*-viewport.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload final Research full-page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-fullpage-ui-${{ github.sha }}
          path: |
            test-results/guided-ui/console-r02-research-*.png
            !test-results/guided-ui/console-r02-research-*-viewport.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload final shared navigation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-owner-ui-${{ github.sha }}
          path: test-results/guided-ui/navigation-*.png
          if-no-files-found: warn
          retention-days: 14

  r03-next:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned inert browser
        run: npx playwright-core install --with-deps chromium
      - name: Verify real production Next navigation and actions
        run: node scripts/verify-r03-next.mjs
      - name: Preserve all screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r03-next-${{ github.sha }}
          path: test-results/r03-next/
          if-no-files-found: error
          retention-days: 14
