name: R08 focused development verification
on:
  push:
    branches:
      - feat/r08-owner-workspace
permissions:
  contents: read
concurrency:
  group: r08-development-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workspace-next:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - run: npx playwright-core install --with-deps chromium
      - run: node scripts/verify-r03-next.mjs --workspace-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r08-development-${{ github.sha }}
          path: test-results/r03-next/
          if-no-files-found: error
          retention-days: 7
